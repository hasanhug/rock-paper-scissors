<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Arcade Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Arcade Header -->
        <header class="header">
            <h1>Rock Paper Scissors</h1>
            <p class="subtitle">Arcade Battle Edition</p>
        </header>

        <!-- Live Scoreboard -->
        <div class="scoreboard">
            <div class="score-card player">
                <div class="score-label">You</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score-card ties">
                <div class="score-label">Ties</div>
                <div class="score-value" id="tieScore">0</div>
            </div>
            <div class="score-card computer">
                <div class="score-label">Bot</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <!-- Battle Arena -->
        <div class="arena">
            <div class="arena-slot">
                <span class="slot-tag">You</span>
                <div class="hand-display" id="playerHand">✊</div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="arena-slot">
                <span class="slot-tag">Computer</span>
                <div class="hand-display" id="computerHand">✊</div>
            </div>
        </div>

        <!-- Result / Announcement Message -->
        <div class="message-box">
            <div class="result-badge default" id="resultBadge">Choose your weapon to start!</div>
        </div>

        <!-- Controls: Weapon Choices -->
        <div class="controls-title">Make Your Move</div>
        <div class="choices-container">
            <button class="choice-btn" data-choice="rock" aria-label="Rock">
                <span class="btn-icon">✊</span>
                <span class="btn-text">Rock</span>
            </button>
            <button class="choice-btn" data-choice="paper" aria-label="Paper">
                <span class="btn-icon">✋</span>
                <span class="btn-text">Paper</span>
            </button>
            <button class="choice-btn" data-choice="scissors" aria-label="Scissors">
                <span class="btn-icon">✌️</span>
                <span class="btn-text">Scissors</span>
            </button>
        </div>

        <!-- Footer Actions -->
        <div class="footer-actions">
            <button class="reset-btn" id="resetBtn">🔄 Reset Score</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
